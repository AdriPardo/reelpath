# Atlas project manifest (ADR-0014) — Reelpath on shared Traefik host
apiVersion: atlas/v1alpha1
kind: Project

metadata:
  name: reelpath

runtime:
  kind: compose
  composeFile: docker-compose.atlas.yml
  # Injected into workspace .env before compose up (survives new workspace seed from .env.atlas.example).
  #
  # Atlas secrets — create via Atlas ops script (NOT end-user UI):
  #   ../../atlas/scripts/seed-project-secrets.sh  (or org PUT /api/v1/secrets)
  #   AUTH_SECRET / CREDENTIALS_ENCRYPTION_KEY → project-owned
  #   ai.openai / ai.elevenlabs / ai.deepseek → org or project (ADR-0017 platform AI)
  #
  # NOT here (different layers):
  #   - POSTGRES_PASSWORD / DOMAIN → .env.atlas.example seed (compose-local Postgres; not Atlas db.url)
  #   - YouTube OAuth app → ops seed PlatformSecret / env (not end-user form)
  #   - git.token / cloudflare.api.token → Atlas Org secrets (clone privado / Autopilot Tunnel+DNS)
  envFrom:
    - secretRef: CREDENTIALS_ENCRYPTION_KEY
    - secretRef: AUTH_SECRET
    # Platform-provided AI (ops seed script). Prefer these over Reelpath UI "Secretos de plataforma".
    - secretRef: ai.openai
    - secretRef: ai.elevenlabs
    - secretRef: ai.deepseek

# Desired projection; Compose file remains source of runtime detail (Traefik labels, volumes).
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    expose:
      port: 4000
      protocol: http
    health:
      path: /health
      intervalSeconds: 15
    dependsOn:
      - db
      - cache

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    dependsOn:
      - db
      - cache

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    expose:
      port: 3000
      protocol: http
    dependsOn:
      - api

  db:
    image: postgres:16-alpine

  cache:
    image: redis:7-alpine

exposure:
  default: public
