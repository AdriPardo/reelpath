services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autotube
      POSTGRES_PASSWORD: autotube
      POSTGRES_DB: autotube
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotube"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://autotube:autotube@postgres:5432/autotube
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      FRONTEND_URL: http://localhost:3000
      STORAGE_PATH: /app/storage
      MOCK_EXTERNAL_APIS: "true"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://autotube:autotube@postgres:5432/autotube
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/storage
      MOCK_EXTERNAL_APIS: "true"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://api:4000
    depends_on:
      - api

  # Optional: n8n for external workflow triggers
  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: autotube
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  storage_data:
  n8n_data:
