# Shared Atlas / Traefik host (atlasops.dev). Producción: sin mocks, auth obligatoria.
# Deploy: docker compose -f docker-compose.atlas.yml up -d --build
#
# .env (seed .env.atlas.example): DOMAIN, POSTGRES_PASSWORD, PLATFORM_ADMIN_EMAILS
# Atlas envFrom (atlas.yml): AUTH_SECRET, CREDENTIALS_ENCRYPTION_KEY,
#   ai.openai / ai.elevenlabs / ai.deepseek → OPENAI_API_KEY / ELEVENLABS_API_KEY / DEEPSEEK_API_KEY
# Runtime resolve: Atlas env → PlatformSecret (BD fallback). End-users never paste AI keys.
# YouTube OAuth app → Admin → Infra (PlatformSecret) or ops script.

name: reelpath

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autotube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotube}
      POSTGRES_DB: autotube
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotube"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    command: ["sh", "-c", "npm run migrate:deploy:ci -w @autotube/database && npm run start -w backend-api"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://autotube:${POSTGRES_PASSWORD:-autotube}@db:5432/autotube
      REDIS_URL: redis://cache:6379
      API_PORT: 4000
      FRONTEND_URL: https://${DOMAIN:-reelpath.atlasops.dev}
      STORAGE_PATH: /app/storage
      MOCK_EXTERNAL_APIS: "false"
      ATLAS_HOSTED: "true"
      AUTH_REQUIRED: "true"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?set CREDENTIALS_ENCRYPTION_KEY in .env}
      NEXT_PUBLIC_AUTH_REQUIRED: "true"
      YOUTUBE_OAUTH_REDIRECT_URI: https://${DOMAIN:-reelpath.atlasops.dev}/api/integrations/youtube/callback
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - atlas-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=atlas-public"
      # /api/media/* is a cookie-auth alias (browser <img>/<video>); strip to /api/* like Caddy.
      # Must outrank PathPrefix(`/api`) or Express returns HTML 404 (no /api/media mount).
      - "traefik.http.middlewares.reelpath-media-strip.replacepathregex.regex=^/api/media/(.*)"
      - "traefik.http.middlewares.reelpath-media-strip.replacepathregex.replacement=/api/$$1"
      - "traefik.http.routers.reelpath-media.rule=Host(`${DOMAIN:-reelpath.atlasops.dev}`) && PathPrefix(`/api/media`)"
      - "traefik.http.routers.reelpath-media.entrypoints=websecure"
      - "traefik.http.routers.reelpath-media.tls=true"
      - "traefik.http.routers.reelpath-media.tls.certresolver=cloudflare"
      - "traefik.http.routers.reelpath-media.priority=200"
      - "traefik.http.routers.reelpath-media.middlewares=reelpath-media-strip"
      - "traefik.http.routers.reelpath-media.service=reelpath-api"
      - "traefik.http.routers.reelpath-api.rule=Host(`${DOMAIN:-reelpath.atlasops.dev}`) && ((PathPrefix(`/api`) && !PathPrefix(`/api/media`)) || Path(`/health`) || Path(`/health/extended`) || Path(`/ready`) || Path(`/metrics`))"
      - "traefik.http.routers.reelpath-api.entrypoints=websecure"
      - "traefik.http.routers.reelpath-api.tls=true"
      - "traefik.http.routers.reelpath-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.reelpath-api.priority=100"
      - "traefik.http.services.reelpath-api.loadbalancer.server.port=4000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://autotube:${POSTGRES_PASSWORD:-autotube}@db:5432/autotube
      REDIS_URL: redis://cache:6379
      STORAGE_PATH: /app/storage
      MOCK_EXTERNAL_APIS: "false"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      ATLAS_HOSTED: "true"
      AUTH_REQUIRED: "true"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?set CREDENTIALS_ENCRYPTION_KEY in .env}
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-reelpath.atlasops.dev}
        NEXT_PUBLIC_AUTH_REQUIRED: "true"
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal
      - atlas-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=atlas-public"
      - "traefik.http.routers.reelpath.rule=Host(`${DOMAIN:-reelpath.atlasops.dev}`)"
      - "traefik.http.routers.reelpath.entrypoints=websecure"
      - "traefik.http.routers.reelpath.tls=true"
      - "traefik.http.routers.reelpath.tls.certresolver=cloudflare"
      - "traefik.http.routers.reelpath.priority=1"
      - "traefik.http.services.reelpath.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  storage_data:

networks:
  internal:
  atlas-public:
    external: true
